<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="form_container">
        <form action="" class="form_item" onsubmit="return validateForm()">
            <div class="container_flex_components">
                <div class="container_grid_components">
                    <label for="name">Name</label>
                    <input placeholder="Name" class="input_form" type="text" id="name" name="name">
                    <p id="name_container"></p>
                </div>
                <div class="container_grid_components">
                    <label for="surname">Surname</label>
                    <input type="text" placeholder="Surname" class="input_form" id="surname" name="surname">
                    <p id="surname_container"></p>
                </div>
            </div>
            <div class="container_grid_components">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="example@example.com" class="input_form" name="email">
                <p id="email_container"></p>
            </div>
            <div class="container_flex_components">
                <div class="container_grid_components">
                    <label for="state">State</label>
                    <select class="input_form" name="state" id="State">
                        <optgroup label="Azərbaycan">
                            <option value="+994">+994 - Azərbaycan</option>
                        </optgroup>
                    </select>
                </div>
                <div class="container_grid_components">
                    <label for="phone_number">Phone Number</label>
                    <input type="tel" class="input_form" placeholder="Phone Number" name="phone_number"
                        id="phone_number">
                    <p id="phone_number_container"></p>

                </div>
            </div>
            <div class="container_grid_components">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" class="input_form" placeholder="Address">
                <p id="address_container"></p>
            </div>
            <div class="container_grid_components">
                <label for="city">City</label>
                <input type="text" id="city" name="city" class="input_form" placeholder="City">
                <p id="city_container"></p>
            </div>
            <button class="button-36" role="button">Apply</button>
        </form>
    </div>

    <script>
function validateForm() {
    const errorMessages = document.querySelectorAll('.error-message');
    errorMessages.forEach(message => message.remove());

    const name = document.getElementById("name").value;
    const surname = document.getElementById("surname").value;
    const email = document.getElementById("email").value;
    const phoneNumber = document.getElementById("phone_number").value;
    const address = document.getElementById("address").value;
    const city = document.getElementById("city").value;

    const name_container = document.getElementById('name_container');
    const surname_container = document.getElementById('surname_container');
    const email_container = document.getElementById('email_container');
    const phone_number_container = document.getElementById('phone_number_container');
    const address_container = document.getElementById('address_container');
    const city_container = document.getElementById('city_container');
    
    const nameRegex = /^[A-Za-z\s]+$/;
    if (!nameRegex.test(name)) {
        showError(name_container, "Invalid name.");
        return false;
    }

    const surnameRegex = /^[A-Za-z\s]+$/;
    if (!surnameRegex.test(surname)) {
        showError(surname_container, "Invalid surname.");
        return false;
    }

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
        showError(email_container, "Invalid email.");
        return false;
    }

    const phoneRegex = /^[+]?\d{1,3}[\s\-]?\(?\d{1,4}\)?[\s\-]?\d{1,4}[\s\-]?\d{1,4}$/;
    if (!phoneRegex.test(phoneNumber)) {
        showError(phone_number_container, "Invalid phone number.");
        return false;
    }

    const addressCityRegex = /^[A-Za-z0-9\s\-,.#]+$/;
    if (!addressCityRegex.test(address)) {
        showError(address_container, "Invalid address.");
        return false;
    }

    if (!addressCityRegex.test(city)) {
        showError(city_container, "Invalid city.");
        return false;
    }

    return true;
}

function showError(element, message) {
    const errorMessage = document.createElement('div');
    errorMessage.classList.add('error-message');
    errorMessage.style.color = 'red';
    errorMessage.innerText = message;
    element.appendChild(errorMessage);
}
    </script>
</body>

</html>
