<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="form_container">
        <form action="" class="form_item">
            <div class="container_flex_components">
                <div class="container_grid_components">
                    <label for="name">Name</label>
                    <input placeholder="Name" class="input_form" type="text" id="name" name="name">
                </div>
                <div class="container_grid_components">
                    <label for="surname">Surname</label>
                    <input type="text" placeholder="Surname" class="input_form" id="surname" name="surname">
                </div>
            </div>
            <div class="container_grid_components">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Email" class="input_form" name="email">
            </div>
            <div class="container_flex_components">
                <div class="container_grid_components">
                    <label for="state">State</label>
                    <select class="input_form" name="state" id="State">
                        <optgroup label="Azərbaycan">
                            <option value="+994">+994 - Azərbaycan</option>
                        </optgroup>
                        <optgroup label="Azərbaycan">
                            <option value="+994">+994 - Azərbaycan</option>
                        </optgroup>

                    </select>
                </div>
                <div class="container_grid_components">
                    <label for="name">Phone Number</label>
                    <input type="phone_number" class="input_form" placeholder="Phone Number" name="phone_number"
                        id="phone_number">
                </div>
            </div>
            <div class="container_grid_components">
                <label for="name">Address</label>
                <input type="text" id="address" name="address" class="input_form" placeholder="Address">
            </div>
            <div class="container_grid_components">
                <label for="name">City</label>
                <input type="text" id="city" name="city" class="input_form" placeholder="City">
            </div>
            <button class="button-36" role="button">Apply</button>
        </form>
    </div>
</body>

</html>
